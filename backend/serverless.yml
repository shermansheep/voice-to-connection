service: voice-to-connection-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}
    REGION: ap-southeast-2
    SERVICES_TABLE: Voice-to-Connection
    VOICE_BUCKET: ${self:service}-voice-${self:provider.stage}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:ap-southeast-2:132690413419:table/Voice-to-Connection"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - "arn:aws:s3:::${self:provider.environment.VOICE_BUCKET}/*"
        - Effect: Allow
          Action:
            - transcribe:StartTranscriptionJob
            - transcribe:GetTranscriptionJob
            - polly:SynthesizeSpeech
          Resource: "*"

plugins:
  - serverless-esbuild
  - serverless-offline

functions:
  # 認證相關
  register:
    handler: src/functions/auth/register.handler
    events:
      - http:
          path: auth/register
          method: post
          cors: true

  # 服務相關
  createService:
    handler: src/functions/services/createService.handler
    events:
      - http:
          path: services
          method: post
          cors: true

  getServices:
    handler: src/functions/services/getServices.handler
    events:
      - http:
          path: services
          method: get
          cors: true

  # 配對相關
  findMatches:
    handler: src/functions/matching/findMatches.handler
    events:
      - http:
          path: matching/find
          method: post
          cors: true

  # 語音相關
  transcribeVoice:
    handler: src/functions/voice/transcribe.handler
    events:
      - http:
          path: voice/transcribe
          method: post
          cors: true

  # 管理員相關
  getAdminStats:
    handler: src/functions/admin/getStats.handler
    events:
      - http:
          path: admin/stats
          method: get
          cors: true

resources:
  Resources:
    # S3 Bucket for voice files
    VoiceBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.VOICE_BUCKET}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE]
              AllowedOrigins: ['*']